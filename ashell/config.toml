log_level = "warn"
outputs = { Targets = ["eDP-1"] }
position = "Top"
app_launcher_cmd = "walker"

[modules]
left = [ [ "Updates", "Workspaces" ] ]
center = [ "Clock", "CustomWeather" ]
right = [ "SystemInfo", [  "Privacy", "Settings", "Tray" ] ]

[updates]
check_cmd = "checkupdates; paru -Qua"
update_cmd = 'kitty -e bash -c "paru; echo Done - Press enter to exit; read" &'

[clock]
format = "%A - %D - %I:%M %p"

[workspaces]
enable_workspace_filling = true

[window_title]
truncate_title_after_length = 100

[settings]
lock_cmd = "playerctl --all-players pause; nixGL hyprlock &"
audio_sinks_more_cmd = "pavucontrol -t 3"
audio_sources_more_cmd = "pavucontrol -t 4"
wifi_more_cmd = "nm-connection-editor"
vpn_more_cmd = "nm-connection-editor"
bluetooth_more_cmd = "blueberry"

[appearance]
# font_name = "Hack Nerd Font"
style = "Islands"
scale_factor = 1.70
opacity = 0.5

primary_color = "#7aa2f7"
success_color = "#9ece6a"
text_color = "#a9b1d6"
workspace_colors = [ "#7aa2f7", "#9ece6a" ]
special_workspace_colors = [ "#7aa2f7", "#9ece6a" ]

[appearance.menu]
opacity = 0.85
backdrop = 0.3

[appearance.danger_color]
base = "#f7768e"
weak = "#e0af68"

[appearance.background_color]
base = "#1a1b26"
weak = "#24273a"
strong = "#414868"

[appearance.secondary_color]
base = "#0c0d14"

[[CustomModule]]
name = "CustomWeather"
icon = "🌡️"
command = "brave --force-device-scale-factor=1.5 --target=window google.com/search?q=weather"
listen_cmd = "/home/lucas/.config/ashell/weather_listen.sh"
